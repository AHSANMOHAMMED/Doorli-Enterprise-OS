name: Enterprise OS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q apps/doorli_core scripts
      - run: python -m py_compile apps/doorli_core/doorli_core/api.py
      - run: git diff --check
      - name: Validate production configuration
        run: |
          test -f docker-compose.yml
          test -x scripts/backup-enterprise.sh
          test -x scripts/verify-enterprise-backup.sh
